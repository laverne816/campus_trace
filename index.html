<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CPUT lost and found for District Six, Bellville, Mowbray, Wellington and Granger Bay.">
<title>CPUT Campus Trace | Lost &amp; Found</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header><div class="bar"><a href="#browse" class="logo"><i></i>CAMPUS TRACE</a><nav id="nav"></nav><button class="tg" id="tg" data-a="theme" aria-label="Toggle light or dark mode"></button></div></header>
<main id="app"></main><div id="toast"></div>
<button class="fab" data-c="tog" aria-label="AI assistant"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg></button>
<section id="chat" class="chat" aria-hidden="true"><div class="ch"><span class="hud" style="margin:0">● TRACE AI</span><span class="row" style="gap:4px"><button class="ib" data-c="clr" aria-label="New chat">↺</button><button class="ib" data-c="x" aria-label="Close">✕</button></span></div><div id="cmsgs" class="cmsgs"></div><form id="cform" class="cf"><input id="cin" placeholder="Ask about items or claims…" autocomplete="off" maxlength="400"><button class="btn sm" aria-label="Send">↑</button></form></section>
<script src="app.js?v=2"></script>
</body>
